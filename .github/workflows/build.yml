name: Wii U build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build SDK image
        run: docker build -t component-builder .
      - name: Compile
        run: docker run --rm --network none -e GITHUB_SHA -v "$PWD:/project" -w /project component-builder sh build.sh
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD > BUILD-COMMIT.txt
          docker image inspect component-builder > BUILD-TOOLCHAIN.json
          sha256sum *.dol > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: UInjectForge-Nintendont-Autobooter-build
          if-no-files-found: error
          path: |
            *.dol
            BUILD-COMMIT.txt
            BUILD-TOOLCHAIN.json
            SHA256SUMS.txt
            LICENSE*
            THIRD-PARTY-NOTICES.md
            licenses/
